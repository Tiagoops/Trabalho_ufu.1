services:
  inventario:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: trabalho-ufu:local
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ..
        target: /app
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: trabalho-ufu:local
    command: ["waitress-serve", "--listen=0.0.0.0:8000", "--call", "app_web:create_app"]
    ports:
      - "127.0.0.1:8000:8000"
    user: "65534:65534"
    read_only: true
