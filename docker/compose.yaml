services:
  inventario:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: trabalho-ufu:local
    stdin_open: true
    tty: true
    environment:
      INVENTARIO_HOST: 0.0.0.0
      INVENTARIO_ARQUIVO: /dados/inventario.json
    user: "65534:65534"
    volumes:
      - type: bind
        source: ..
        target: /app
      - type: bind
        source: ../dados
        target: /dados
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: trabalho-ufu:local
    command: ["python", "-B", "iniciar_web.py"]
    environment:
      INVENTARIO_ARQUIVO: /dados/inventario.json
      INVENTARIO_HOST: 0.0.0.0
      INVENTARIO_DEMONSTRACAO: "1"
    ports:
      - "127.0.0.1:8000:8000"
    user: "65534:65534"
    read_only: true
    volumes:
      - type: bind
        source: ../dados
        target: /dados
